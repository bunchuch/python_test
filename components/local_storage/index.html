<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
(function () {
    function send(value) {
        window.parent.postMessage(
            { isStreamlitMessage: true, type: "streamlit:setComponentValue",
              value: value, dataType: "json" },
            "*"
        );
    }

    window.addEventListener("message", function (e) {
        var d = e.data;
        if (!d || d.type !== "streamlit:render") return;

        var args   = d.args  || {};
        var action = args.action || "get";
        var key    = args.ls_key || "";
        var value  = args.ls_val || "";

        try {
            if (action === "set") {
                localStorage.setItem(key, value);
                send("ok");
            } else if (action === "del") {
                localStorage.removeItem(key);
                send("ok");
            } else {
                send(localStorage.getItem(key) || "");
            }
        } catch (err) {
            send("");
        }
    });

    // Signal component ready
    window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
        "*"
    );
})();
</script>
</body>
</html>
